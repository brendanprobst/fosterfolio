# Agent registry
#
# Source of truth: agents/prompts/<id>.md
#
# Generate tool-specific configs from these prompts:
#   npm run use:claude   →  CLAUDE.md files (hierarchical, one per glob directory)
#   npm run use:cursor   →  .cursor/rules/*.mdc files (frontmatter + body)
#   npm run agents:sync  →  both simultaneously

agents:
  - id: ddd-expert
    path: prompts/ddd-expert.md
    description: "DDD expert — domain & application layers (auto when editing domain/use-case files)"
    scope: path-scoped
    globs:
      - apps/api/domain/**
      - apps/api/application/**
      - docs/adr/**

  - id: test-expert
    path: prompts/test-expert.md
    description: "Test expert — Jest & integration tests (auto when editing tests or feature code under apps/)"
    scope: path-scoped
    globs:
      - test/api/**
      - test/web/**
      - test/AGENTS.md
      - apps/api/**
      - apps/web/client/**
      - apps/web/app/**

  - id: infra-expert
    path: prompts/infra-expert.md
    description: "Infra expert — adapters, composition root, config, seed (auto when editing infra/config)"
    scope: path-scoped
    globs:
      - apps/api/infrastructure/**
      - apps/api/config/**
      - apps/web/client/lib/**
      - seed.json

  - id: debugger-expert
    path: prompts/debugger-expert.md
    description: "Debugger expert — attach with @Rules when investigating failures, flakes, or production errors"
    scope: attach-via-rules
    command: debug

  - id: code-janitor
    path: prompts/code-janitor.md
    description: "Code janitor — attach with @Rules for audits, cleanup PRs, consistency, and hygiene"
    scope: attach-via-rules
    command: janitor

  - id: session
    path: prompts/session.md
    description: "Session close-out — /session or @Rules after a stretch of agent work to re-review files touched, take a brain dump, and commit a session-log stop with a SESSION trailer"
    scope: attach-via-rules
    command: session

  - id: session-review
    path: prompts/session-review.md
    description: "Session review — /session-review or @Rules to re-read every file from a work session across chats and git history, without editing"
    scope: attach-via-rules
    command: session-review

  - id: session-fix
    path: prompts/session-fix.md
    description: "Session fix — /session-fix or @Rules to apply only the quick fixes from a session review"
    scope: attach-via-rules
    command: session-fix

  - id: session-next
    path: prompts/session-next.md
    description: "Session next — /session-next or @Rules to append the session stop to docs/plans/sessions/log.md and commit it with a SESSION trailer"
    scope: attach-via-rules
    command: session-next

